syntax = "proto3";

package proto;

service Flashcards {
  rpc ProcessDeckShareResponse (DeckShareResponseRequest) returns (DeckShareResponse);
}

message DeckShareResponseRequest {
  string request_id = 1;
  string notification_id = 2;
  string deck_id = 3;
  string sender_id = 4;
  string receiver_id = 5;
  string response = 6;
}

message DeckShareResponse {
  string request_id = 1;
  bool success = 2;
  string message = 3;
} 